name: Temporary Cashier Wiring Formatter

on:
  push:
    branches:
      - feat/cashier-transaction-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/cashier-transaction-foundation

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatter
        run: |
          pnpm exec prettier --write \
            apps/cashier/src/app/providers/cashier-providers.tsx \
            apps/cashier/src/app/shell/cashier-shell.tsx

      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/cashier/src/app/providers/cashier-providers.tsx \
            apps/cashier/src/app/shell/cashier-shell.tsx
          git commit -m "chore(cashier): format restored wiring"
          git push origin HEAD:feat/cashier-transaction-foundation
