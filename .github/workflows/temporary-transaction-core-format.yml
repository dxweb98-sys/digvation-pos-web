name: Temporary Transaction Core Formatter

on:
  push:
    branches:
      - feat/cashier-transaction-core
    paths:
      - .github/workflows/temporary-transaction-core-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/cashier-transaction-core
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@11.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: pnpm format
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(cashier): apply transaction core formatting"
          git push origin HEAD:feat/cashier-transaction-core
