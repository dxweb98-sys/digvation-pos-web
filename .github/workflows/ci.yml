name: Frontend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile 2>&1 | tee install.log

      - name: Preserve install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-diagnostics
          path: install.log
          if-no-files-found: error

      - name: Preserve initial lockfile
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Verify foundation
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: pnpm verify

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: pnpm test:e2e
